# Nginx site config for TOLSOVKA (Express API + static frontend)
# Place as /etc/nginx/sites-available/tolsovka.conf and symlink to sites-enabled.
# Adjust server_name and root to your domain and filesystem.

upstream tol_api {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name example.com www.example.com;  # TODO: replace

    # Optional: redirect HTTP->HTTPS if TLS configured
    # return 301 https://$host$request_uri;

    # Static frontend build
    root /var/www/tolsovka/frontend/dist;
    index index.html;

    # Cache static assets aggressively
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback for client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://tol_api;
        proxy_http_version 1.1;
    }

    # Uploads: either serve directly from filesystem or proxy to Node
    # Option A (serve directly if /var/www/tolsovka/uploads is the same dir Node writes to)
    # location /uploads/ {
    #     alias /var/www/tolsovka/uploads/;
    #     autoindex off;
    #     expires 7d;
    #     add_header Cache-Control "public, max-age=604800" always;
    # }

    # Option B (proxy to Node's express.static as implemented now)
    location /uploads/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://tol_api;
        proxy_http_version 1.1;
    }

    # Security headers (can be tuned further or delegated to Helmet for /api)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
}
